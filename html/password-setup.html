<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Setup — Secure Profile Lock</title>
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="page" data-i18n-title="setup_title">
  <main class="card" id="card">
    <div class="lock-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 2.5 4.5 5.5v5c0 4.8 3.2 8.6 7.5 10.5 4.3-1.9 7.5-5.7 7.5-10.5v-5L12 2.5z"></path>
        <path d="M9 11.5l2.2 2.2L15.5 9.5"></path>
      </svg>
    </div>

    <h1 id="pageTitle" data-i18n="setup_title">Protect This Profile</h1>
    <p class="subtitle" id="pageSubtitle" data-i18n="setup_subtitle">
      Set a password for this browser profile. It will be required every time the browser starts.
    </p>

    <form id="passwordForm" novalidate>
      <div class="field hidden" id="currentField">
        <label for="currentPassword" data-i18n="label_current_password">Current password</label>
        <div class="input-wrap">
          <input type="password" id="currentPassword" autocomplete="current-password">
          <button type="button" class="eye" id="eyeCurrent" data-i18n-aria="aria_show_password" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="password" data-i18n="label_new_password">New password</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="new-password" minlength="8"
                 data-i18n-placeholder="ph_password" placeholder="At least 8 characters">
          <button type="button" class="eye" id="eyeNew" data-i18n-aria="aria_show_password" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
        <div class="strength" id="strength" data-score="0">
          <div class="strength-bars"><span></span><span></span><span></span><span></span></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword" data-i18n="label_confirm_password">Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" autocomplete="new-password">
          <button type="button" class="eye" id="eyeConfirm" data-i18n-aria="aria_show_password" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="hint">
          <span data-i18n="label_hint">Password hint</span>
          <span style="font-weight:400" data-i18n="optional">(optional)</span>
        </label>
        <input type="text" id="hint" data-i18n-placeholder="ph_hint"
               placeholder="Something only you would understand"
               autocomplete="off" maxlength="120">
      </div>

      <button type="submit" class="btn" id="submitBtn" data-i18n="btn_save">Save Password</button>
    </form>

    <div id="message" class="message hidden" role="alert"></div>

    <div id="successState" class="success-state hidden">
      <div class="success-check" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"></path></svg>
      </div>
      <h1 id="successTitle" data-i18n="success_title">You're Protected</h1>
      <p class="subtitle" id="successText" data-i18n="success_text">
        Your profile will lock automatically the next time the browser starts.
      </p>
      <button type="button" class="btn btn-ghost" id="lockNowBtn" data-i18n="btn_lock_test">Lock now to test it</button>
    </div>

    <footer class="card-footer">
      <span data-i18n="footer_setup">Password is hashed and stored only on this device</span>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="auto" data-i18n="lang_auto">Auto (browser language)</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </footer>
  </main>

  <script src="../scripts/i18n.js"></script>
  <script src="../scripts/password-setup.js"></script>
</body>
</html>
