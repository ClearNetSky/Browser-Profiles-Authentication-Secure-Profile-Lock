<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Setup — Secure Profile Lock</title>
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="page">
  <main class="card" id="card">
    <div class="lock-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 2.5 4.5 5.5v5c0 4.8 3.2 8.6 7.5 10.5 4.3-1.9 7.5-5.7 7.5-10.5v-5L12 2.5z"></path>
        <path d="M9 11.5l2.2 2.2L15.5 9.5"></path>
      </svg>
    </div>

    <h1 id="pageTitle">Protect This Profile</h1>
    <p class="subtitle" id="pageSubtitle">
      Set a password for this browser profile. It will be required every time the browser starts.
    </p>

    <form id="passwordForm" novalidate>
      <div class="field hidden" id="currentField">
        <label for="currentPassword">Current password</label>
        <div class="input-wrap">
          <input type="password" id="currentPassword" autocomplete="current-password">
          <button type="button" class="eye" id="eyeCurrent" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="password" id="newPasswordLabel">New password</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="new-password" minlength="8"
                 placeholder="At least 8 characters">
          <button type="button" class="eye" id="eyeNew" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
        <div class="strength" id="strength" data-score="0">
          <div class="strength-bars"><span></span><span></span><span></span><span></span></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" autocomplete="new-password">
          <button type="button" class="eye" id="eyeConfirm" aria-label="Show password" tabindex="-1">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="hint">Password hint <span style="font-weight:400">(optional)</span></label>
        <input type="text" id="hint" placeholder="Something only you would understand"
               autocomplete="off" maxlength="120">
      </div>

      <button type="submit" class="btn" id="submitBtn">Save Password</button>
    </form>

    <div id="message" class="message hidden" role="alert"></div>

    <div id="successState" class="success-state hidden">
      <div class="success-check" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"></path></svg>
      </div>
      <h1 id="successTitle">You're Protected</h1>
      <p class="subtitle" id="successText">
        Your profile will lock automatically the next time the browser starts.
      </p>
      <button type="button" class="btn btn-ghost" id="lockNowBtn">Lock now to test it</button>
    </div>

    <footer class="card-footer">Secure Profile Lock · Password is hashed and stored only on this device</footer>
  </main>

  <script src="../scripts/password-setup.js"></script>
</body>
</html>
